  /update-realestate-profile/{realestate}:
    post:
      summary: Update real estate profile information
      operationId: updateRealEstateProfile
      tags:
        - Real Estates
      security:
        - bearerAuth: []
      parameters:
        - name: realestate
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the real estate
                tagline:
                  type: string
                  description: Tagline or short description of the real estate
                city:
                  type: string
                  description: City where the real estate is located
                address:
                  type: string
                  description: Full address of the real estate
                image:
                  type: string
                  format: binary
                  description: Optional image file (max 4MB, formats:jpeg, png, jpg)
      responses:
        '200':
          description: Real estate profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  real_estate:
                    $ref: '#/components/schemas/RealEstate'
        '401':
          description: Unauthorized - User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'